[package]
name = "foxfire-hub"
version = "0.1.5"
description = "FoxFire Hub — маркет помогалок и виджетов для стримеров"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "dialog-open", "dialog-save", "fs-read-file", "fs-write-file", "window-close", "window-minimize", "window-set-fullscreen", "window-set-size", "window-start-dragging", "window-create", "protocol-asset", "clipboard-write-text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Реальное скачивание файлов виджетов с GitHub (Задание: реальная загрузка).
reqwest = { version = "0.11", features = ["blocking"] }
# Распаковка скачанного .zip-архива виджета на диск.
zip = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
